<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Carousel - City Vet</title>
    <script>
        fetch('../../api/auth/session_check.php')
            .then(res => res.json())
            .then(data => {
                if (data.status !== 'success' || data.user.role != 4) window.location.replace('../../login.html');
            })
            .catch(() => window.location.replace('../../login.html'));
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-transition { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
    <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden lg:hidden backdrop-blur-sm"></div>
    <div id="sidebar-container"></div>
    <script src="../../js/sidebar_staff.js"></script>

    <div class="flex-1 flex flex-col h-screen relative">
        <header class="bg-white h-16 flex items-center justify-between px-4 lg:px-8 shadow-sm z-10 border-b border-gray-100">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-600 hover:text-[#00796B] text-xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 class="text-xl font-bold text-gray-800">Homepage Carousel & Events Blog CMS</h2>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8">
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 h-fit">
                    <h3 class="font-bold text-gray-800 text-lg mb-5 flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-[#00796B]"></i> Publish Homepage Update
                    </h3>
                    <form id="carouselForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Content Section</label>
                            <select name="section" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none">
                                <option value="highlight">City Vet Highlights & Vlogs</option>
                                <option value="announcement">Events & Veterinary Blog</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Title</label>
                            <input name="title" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="Rabies-Free Community / Veterinary Update">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Subtitle</label>
                            <textarea name="subtitle" rows="3" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="Short caption for the homepage events/blog section"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Badge</label>
                            <input name="badge" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="Announcement / Health Alert / Pet Care Tip">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Sort Order</label>
                            <input name="sort_order" type="number" value="0" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Image</label>
                            <input name="image" type="file" accept="image/jpeg,image/png,image/webp" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-teal-50 file:text-[#00796B] hover:file:bg-teal-100">
                            <p class="text-xs text-gray-400 mt-2">JPG, PNG, or WEBP. Max 5MB. This image is used in the public homepage feed.</p>
                        </div>
                        <button class="w-full bg-[#00796B] hover:bg-teal-700 text-white font-bold py-3 rounded-xl shadow-sm transition">
                            Publish Post
                        </button>
                    </form>

                    <div class="mt-8 border-t border-gray-100 pt-6">
                        <h3 class="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2">
                            <i class="fa-brands fa-youtube text-[#00796B]"></i> Add Pet First-Aid Video
                        </h3>
                        <form id="firstAidVideoForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Video Title</label>
                                <input name="title" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="Dog CPR Basics">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Description</label>
                                <textarea name="description" rows="3" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="Short explanation of what the clip covers"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">YouTube URL</label>
                                <input name="youtube_url" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="https://www.youtube.com/watch?v=...">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tags</label>
                                <input name="tags" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none" placeholder="choking, bleeding, dog, first aid">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Sort Order</label>
                                <input name="sort_order" type="number" value="0" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#00796B] outline-none">
                            </div>
                            <button class="w-full bg-[#00796B] hover:bg-teal-700 text-white font-bold py-3 rounded-xl shadow-sm transition">
                                Save Video
                            </button>
                        </form>
                    </div>
                </section>

                <section class="xl:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex items-center justify-between">
                        <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                            <i class="fa-solid fa-images text-[#00796B]"></i> Published Homepage Items
                        </h3>
                        <button onclick="loadCarousel()" class="text-sm font-bold text-[#00796B] hover:underline">Refresh</button>
                    </div>
                    <div id="carouselList" class="grid grid-cols-1 md:grid-cols-2 gap-5 p-6">
                        <p class="text-gray-400">Loading...</p>
                    </div>
                    <div class="border-t border-gray-100 p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                                <i class="fa-brands fa-youtube text-[#00796B]"></i> Published First-Aid Videos
                            </h3>
                            <button onclick="loadFirstAidVideos()" class="text-sm font-bold text-[#00796B] hover:underline">Refresh</button>
                        </div>
                        <div id="firstAidVideoList" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <p class="text-gray-400">Loading...</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('mobileOverlay').classList.toggle('hidden');
        }

        document.getElementById('carouselForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            formData.append('action', 'upload');
            const section = String(formData.get('section') || 'announcement');
            const endpoint = section === 'highlight' ? '../../api/cms/carousel.php' : '../../api/cms/homepage_posts.php';

            try {
                Swal.fire({ title: 'Publishing...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const res = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.status === 'success') {
                    Swal.fire('Published', data.message, 'success');
                    this.reset();
                    loadCarousel();
                } else {
                    Swal.fire('Error', data.message || 'Upload failed.', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Connection failed.', 'error');
            }
        });

        document.getElementById('firstAidVideoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            formData.append('action', 'upload');

            try {
                Swal.fire({ title: 'Saving video...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const res = await fetch('../../api/cms/first_aid_videos.php', { method: 'POST', body: formData });
                const rawText = await res.text();
                let data = {};

                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (parseError) {
                    throw new Error(rawText || 'Server returned an invalid JSON response.');
                }

                if (data.status === 'success') {
                    Swal.fire('Saved', data.message, 'success');
                    this.reset();
                    loadFirstAidVideos();
                } else {
                    Swal.fire('Error', data.message || 'Unable to save video.', 'error');
                }
            } catch (error) {
                Swal.fire('Error', error.message || 'Connection failed.', 'error');
            }
        });

        async function loadCarousel() {
            const list = document.getElementById('carouselList');
            list.innerHTML = '<p class="text-gray-400">Loading...</p>';

            try {
                const [carouselRes, postRes] = await Promise.all([
                    fetch('../../api/cms/carousel.php'),
                    fetch('../../api/cms/homepage_posts.php')
                ]);

                const carouselData = await carouselRes.json();
                const postData = await postRes.json();

                const items = [
                    ...(carouselData.status === 'success' ? carouselData.items.map(item => ({ ...item, Section: 'highlight', Source: 'carousel' })) : []),
                    ...(postData.status === 'success' ? postData.items.map(item => ({ ...item, Section: item.Section || 'announcement', Source: 'homepage' })) : [])
                ].sort((a, b) => {
                    const sectionOrder = { highlight: 0, announcement: 1 };
                    return (sectionOrder[a.Section] ?? 99) - (sectionOrder[b.Section] ?? 99) || Number(b.Sort_Order || 0) - Number(a.Sort_Order || 0);
                });

                if (items.length === 0) {
                    list.innerHTML = '<p class="text-gray-400 md:col-span-2 text-center py-12">No homepage posts uploaded yet.</p>';
                    return;
                }

                list.innerHTML = items.map(item => {
                    const imageSrc = item.Image_Path && item.Image_Path !== '0' ? `../../${item.Image_Path}` : '../../uploads/hero_slides/1.jpg';
                    return `
                        <article class="border border-gray-100 rounded-2xl overflow-hidden bg-gray-50">
                            <div class="aspect-video bg-gray-200 overflow-hidden">
                                <img src="${imageSrc}" alt="${item.Title}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-5">
                                <div class="flex items-start justify-between gap-3 mb-2">
                                    <div>
                                        <h4 class="font-black text-gray-800">${item.Title}</h4>
                                        <p class="text-sm text-gray-500 line-clamp-2">${item.Subtitle || ''}</p>
                                    </div>
                                    <span class="text-[10px] font-bold rounded-full px-2 py-1 ${item.Status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'}">${item.Status}</span>
                                </div>
                                <div class="flex items-center gap-2 mb-3">
                                    <span class="text-[10px] font-bold rounded-full px-2 py-1 bg-[#00796B]/10 text-[#00796B]">${item.Section === 'highlight' ? 'Highlights & Vlogs' : 'Events & Blog'}</span>
                                    <span class="text-[10px] text-gray-400">Sort: ${item.Sort_Order}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="toggleItem(${item.Carousel_ID || item.Post_ID}, '${item.Status === 'active' ? 'inactive' : 'active'}', '${item.Source}')" class="rounded-lg border border-gray-200 py-2 text-sm font-bold text-gray-700 hover:bg-white">
                                        ${item.Status === 'active' ? 'Hide' : 'Show'}
                                    </button>
                                    <button onclick="deleteItem(${item.Carousel_ID || item.Post_ID}, '${item.Source}')" class="rounded-lg border border-red-200 py-2 text-sm font-bold text-red-600 hover:bg-red-50">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (error) {
                list.innerHTML = '<p class="text-red-500">Failed to load homepage items.</p>';
            }
        }

        async function loadFirstAidVideos() {
            const list = document.getElementById('firstAidVideoList');
            list.innerHTML = '<p class="text-gray-400">Loading...</p>';

            try {
                const res = await fetch('../../api/cms/first_aid_videos.php');
                const data = await res.json();

                if (data.status !== 'success' || !Array.isArray(data.items) || data.items.length === 0) {
                    list.innerHTML = '<p class="text-gray-400 md:col-span-2 text-center py-12">No first-aid videos saved yet.</p>';
                    return;
                }

                list.innerHTML = data.items.map(item => `
                    <article class="border border-gray-100 rounded-2xl overflow-hidden bg-gray-50">
                        <div class="aspect-video bg-gray-200">
                            <iframe src="${item.Embed_Url}" title="${item.Title}" class="w-full h-full" loading="lazy" allowfullscreen></iframe>
                        </div>
                        <div class="p-5">
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <div>
                                    <h4 class="font-black text-gray-800">${item.Title}</h4>
                                    <p class="text-sm text-gray-500 line-clamp-2">${item.Description || ''}</p>
                                </div>
                                <span class="text-[10px] font-bold rounded-full px-2 py-1 ${item.Status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'}">${item.Status}</span>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-3">
                                ${(item.Tags || '').split(',').map(tag => tag.trim()).filter(Boolean).map(tag => `<span class="text-[10px] font-bold rounded-full px-2 py-1 bg-[#00796B]/10 text-[#00796B]">${tag}</span>`).join('')}
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="toggleFirstAidVideo(${item.Video_ID}, '${item.Status === 'active' ? 'inactive' : 'active'}')" class="rounded-lg border border-gray-200 py-2 text-sm font-bold text-gray-700 hover:bg-white">
                                    ${item.Status === 'active' ? 'Hide' : 'Show'}
                                </button>
                                <button onclick="deleteFirstAidVideo(${item.Video_ID})" class="rounded-lg border border-red-200 py-2 text-sm font-bold text-red-600 hover:bg-red-50">
                                    Delete
                                </button>
                            </div>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                list.innerHTML = '<p class="text-red-500">Failed to load first-aid videos.</p>';
            }
        }

        async function toggleFirstAidVideo(id, status) {
            const fd = new FormData();
            fd.append('action', 'toggle');
            fd.append('id', id);
            fd.append('status', status);

            const res = await fetch('../../api/cms/first_aid_videos.php', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.status === 'success') loadFirstAidVideos();
            else Swal.fire('Error', data.message || 'Unable to update video.', 'error');
        }

        async function deleteFirstAidVideo(id) {
            const confirm = await Swal.fire({ title: 'Delete this video?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626' });
            if (!confirm.isConfirmed) return;

            const fd = new FormData();
            fd.append('action', 'delete');
            fd.append('id', id);

            const res = await fetch('../../api/cms/first_aid_videos.php', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.status === 'success') loadFirstAidVideos();
            else Swal.fire('Error', data.message || 'Unable to delete video.', 'error');
        }

        async function toggleItem(id, status, source) {
            const fd = new FormData();
            fd.append('action', 'toggle');
            fd.append('id', id);
            fd.append('status', status);
            const endpoint = source === 'carousel' ? '../../api/cms/carousel.php' : '../../api/cms/homepage_posts.php';
            const res = await fetch(endpoint, { method: 'POST', body: fd });
            const data = await res.json();
            if (data.status === 'success') loadCarousel();
            else Swal.fire('Error', data.message || 'Unable to update item.', 'error');
        }

        async function deleteItem(id, source) {
            const confirm = await Swal.fire({ title: 'Delete this post?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626' });
            if (!confirm.isConfirmed) return;
            const fd = new FormData();
            fd.append('action', 'delete');
            fd.append('id', id);
            const endpoint = source === 'carousel' ? '../../api/cms/carousel.php' : '../../api/cms/homepage_posts.php';
            const res = await fetch(endpoint, { method: 'POST', body: fd });
            const data = await res.json();
            if (data.status === 'success') loadCarousel();
            else Swal.fire('Error', data.message || 'Unable to delete item.', 'error');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCarousel();
            loadFirstAidVideos();
        });
    </script>
</body>
</html>
